name = "aquaticmc-website"
main = "server.js"
compatibility_date = "2026-08-21"
compatibility_flags = ["nodejs_compat"]

keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[vars]
PUBLIC_URL = "https://playaquaticmc.net"
